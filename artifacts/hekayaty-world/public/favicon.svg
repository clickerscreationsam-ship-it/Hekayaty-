<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="featherGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE08B" />
      <stop offset="40%" stop-color="#E1C58B" />
      <stop offset="75%" stop-color="#C5A15B" />
      <stop offset="100%" stop-color="#96742E" />
    </linearGradient>
    <linearGradient id="tealAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#087C7B" />
      <stop offset="100%" stop-color="#119B98" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#152238" />
      <stop offset="80%" stop-color="#0B1220" />
      <stop offset="100%" stop-color="#070B14" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Square Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#featherGold)" stroke-width="4" opacity="0.4" />

  <!-- Inner Ambient Glow behind Feather -->
  <circle cx="256" cy="256" r="160" fill="url(#tealAccent)" opacity="0.2" filter="url(#glow)" />

  <!-- Feather Quill Art -->
  <g transform="translate(256, 260) rotate(-45) translate(-256, -260)">
    <!-- Right Vane (Plumes) -->
    <path d="M256,60 C320,100 370,180 370,290 C370,330 350,370 330,390 C340,360 335,320 320,285 C310,265 295,240 280,225 C295,200 310,165 305,140 C285,170 270,195 256,220 Z" fill="url(#featherGold)" opacity="0.95" />

    <!-- Left Vane (Plumes with Teal Accent) -->
    <path d="M256,60 C210,110 160,190 160,295 C160,340 180,380 205,400 C190,370 195,330 210,290 C225,250 240,225 256,200 C240,175 225,140 230,120 C240,140 250,170 256,190 Z" fill="url(#tealAccent)" opacity="0.9" />

    <!-- Delicate Inner Feather Strands -->
    <path d="M256,140 Q310,170 340,240 M256,190 Q310,220 330,290 M256,240 Q290,270 310,330" stroke="#FFF4D4" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M256,150 Q205,190 180,260 M256,210 Q210,240 195,300 M256,260 Q225,290 215,340" stroke="#5EEAD4" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5" />

    <!-- Central Shaft / Rachis -->
    <path d="M256,50 C256,120 255,280 254,410 L256,450 L258,410 C257,280 256,120 256,50 Z" fill="url(#featherGold)" filter="url(#glow)" />
    <path d="M256,50 L255,445" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8" />

    <!-- Quill Nib Golden Tip -->
    <polygon points="251,435 261,435 256,468" fill="#FFF3D0" />
  </g>

  <!-- Celestial Magic Star Sparkles -->
  <g transform="translate(380, 115)">
    <path d="M0,-28 Q0,0 28,0 Q0,0 0,28 Q0,0 -28,0 Q0,0 0,-28 Z" fill="url(#featherGold)" filter="url(#glow)" />
    <circle cx="0" cy="0" r="5" fill="#FFFFFF" />
  </g>
  <g transform="translate(125, 360) scale(0.6)">
    <path d="M0,-24 Q0,0 24,0 Q0,0 0,24 Q0,0 -24,0 Q0,0 0,-24 Z" fill="#5EEAD4" filter="url(#glow)" opacity="0.8" />
  </g>
</svg>
